<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="健身管家" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>健身管家 · 你的训练操作系统</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONAL TRAINING OS</div>
          <div class="brand">健身管家<span class="brand-dot">.</span></div>
        </div>
        <button class="icon-button" data-view="settings" aria-label="设置">⚙</button>
      </header>

      <main id="app" class="main-content"></main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab active" data-view="home"><span>⌂</span><small>首页</small></button>
        <button class="tab" data-view="workout"><span>◉</span><small>训练</small></button>
        <button class="tab" data-view="plans"><span>▦</span><small>计划</small></button>
        <button class="tab" data-view="exercises"><span>＋</span><small>动作</small></button>
        <button class="tab" data-view="me"><span>◒</span><small>我的</small></button>
      </nav>
    </div>
    <div id="modal-root"></div>
    <script src="app.js"></script>
  </body>
</html>
